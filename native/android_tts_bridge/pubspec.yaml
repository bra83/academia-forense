name: android_tts_bridge
description: Android Native TTS Bridge plugin for Academia Forense (Kokoro Sherpa-ONNX).
version: 0.1.0
publish_to: 'none'

environment:
  sdk: ^3.5.0
  flutter: ">=3.24.0"

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  plugin:
    platforms:
      android:
        package: com.academia_forense.tts_bridge
        pluginClass: AndroidTtsBridgePlugin
