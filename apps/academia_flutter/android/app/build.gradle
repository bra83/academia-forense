plugins {
    id "com.android.application"
    id "kotlin-android"
    // The Flutter Gradle Plugin must be applied after the Android and Kotlin Gradle plugins.
    id "dev.flutter.flutter-gradle-plugin"
}

android {
    namespace = "com.academiaforense.academia_flutter"
    compileSdk = flutter.compileSdkVersion
    ndkVersion = flutter.ndkVersion

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_1_8
        targetCompatibility = JavaVersion.VERSION_1_8
    }

    kotlinOptions {
        jvmTarget = JavaVersion.VERSION_1_8
    }

    defaultConfig {
        // TODO: Specify your own unique Application ID (https://developer.android.com/studio/build/application-id.html).
        applicationId = "com.academiaforense.academia_v2"
        // You can update the following values to match your application needs.
        // For more information, see: https://flutter.dev/to/review-gradle-config.
        minSdk = 26
        targetSdk = flutter.targetSdkVersion
        versionCode = flutter.versionCode
        versionName = flutter.versionName
    }

    def releaseKeystore = System.getenv("ACADEMIA_KEYSTORE_PATH")
    signingConfigs {
        stableRelease {
            if (releaseKeystore) {
                storeFile file(releaseKeystore)
                storePassword System.getenv("ACADEMIA_KEYSTORE_PASSWORD")
                keyAlias System.getenv("ACADEMIA_KEY_ALIAS")
                keyPassword System.getenv("ACADEMIA_KEY_PASSWORD")
            }
        }
    }
    buildTypes {
        release {
            // Stable signed releases use a private key supplied by the owner.
            // Debug-signed packages are test-only and not upgrade-compatible.
            signingConfig = releaseKeystore ? signingConfigs.stableRelease : signingConfigs.debug
        }
    }
}

flutter {
    source = "../.."
}
